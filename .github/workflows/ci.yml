name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/samiul-sami-new/devops-deployment-dashboard:latest
            ghcr.io/samiul-sami-new/devops-deployment-dashboard:${{ github.sha }}
      - name: Debug GitHub OIDC claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{aud, sub, repository, ref}'
      - name: Validate Docker image build
        if: github.event_name == 'pull_request'
        run: docker build --tag devops-deployment-dashboard:ci .

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ca-west-1
          role-to-assume: arn:aws:iam::183882055321:role/Sami-GitHubActions-DevOpsDeploy-Role

      - name: Deploy to EC2 via AWS Systems Manager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          INSTANCE_ID: i-05edf3f5467a64ec9
          AWS_REGION: ca-west-1
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters 'commands=[
              "set -e",
              "sudo -iu ec2-user git -C /home/ec2-user/devops-deployment-dashboard pull --ff-only origin main",
              "docker compose -f /home/ec2-user/devops-deployment-dashboard/docker-compose.yml pull",
              "docker compose -f /home/ec2-user/devops-deployment-dashboard/docker-compose.yml up -d",
              "for i in {1..12}; do if curl -fsS http://localhost:8080/health >/dev/null; then echo \"Health check passed\"; exit 0; fi; echo \"Waiting for application health...\"; sleep 5; done",
              "echo \"Health check failed\"",
              "exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "SSM deployment completed successfully."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text