services:
  app:
    image: ghcr.io/samiul-sami-new/devops-deployment-dashboard:latest
    container_name: devops-deployment-dashboard
    ports:
      - "8080:3000"
    environment:
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-2.0.0-local}
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - dashboard-network

networks:
  dashboard-network:
    name: devops-dashboard-network
